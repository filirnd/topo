name: Windows installer

on:
  push:
    branches: [main, feature/windows-installer]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build cloud backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --clean --noconfirm --onefile --name tapo-backend `
            --add-data "cloud_web;cloud_web" `
            --add-data "certs;certs" `
            --add-data "data/io.github.filirnd.topo.png;." `
            tapo_cloud_app.py

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest `
            -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' `
            -OutFile $archive
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $binary = Get-ChildItem -Path $extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'FFmpeg executable was not found in the downloaded archive.' }
          New-Item -ItemType Directory -Force -Path windows/dist | Out-Null
          Copy-Item $binary.FullName windows/dist/ffmpeg.exe
          Copy-Item dist/tapo-backend.exe windows/dist/tapo-backend.exe

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Align Windows app version with release tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: windows
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release tag must contain a semantic version, for example v0.1.3. Got: $env:GITHUB_REF_NAME"
          }
          npm version $version --no-git-tag-version

      - name: Build installer
        working-directory: windows
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: topo-windows-x64
          path: windows/out/*

      - name: Create GitHub Release and upload installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -Path windows/out -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not found.' }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii windows/out/SHA256SUMS.txt
          gh release create $env:GITHUB_REF_NAME `
            $installer.FullName `
            windows/out/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --title "Topo $env:GITHUB_REF_NAME" `
            --generate-notes
