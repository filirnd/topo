<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topo - desktop app for Tapo camera</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #edede9; --surface: #f5ebe0; --surface-2: #e3d5ca; --surface-3: #d6ccc2;
      --border: #d5bdaf; --muted: #756961; --text: #3f3834;
      --accent: #d5bdaf; --accent-strong: #e3d5ca; --success: #756961;
      --warning: #75604f; --danger: #b58f7e; --shadow: 0 14px 30px rgba(63, 56, 52, .16);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body { min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); }
    button, input, select { font: inherit; }
    button { border: 0; border-radius: 10px; padding: 10px 13px; background: var(--accent); color: var(--text); cursor: pointer; transition: background .16s ease, transform .16s ease, opacity .16s ease; }
    button:hover:not(:disabled) { background: var(--text); color: var(--bg); transform: translateY(-1px); }
    button:focus-visible, input:focus-visible, select:focus-visible, .preview:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button.secondary { background: var(--surface-2); color: var(--text); } button.secondary:hover:not(:disabled) { background: var(--accent-strong); }
    button.ghost { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    button.danger { background: var(--danger); border: 1px solid var(--accent); color: var(--text); } button.danger:hover:not(:disabled) { background: var(--surface-2); }
    button:disabled { cursor: wait; opacity: .58; transform: none; }
    .hidden { display: none !important; }
    .app-header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 78px; padding: 13px clamp(16px, 4vw, 44px); border-bottom: 1px solid var(--border); background: var(--surface); }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-icon { width: 48px; height: 48px; border-radius: 14px; flex: 0 0 auto; object-fit: cover; box-shadow: 0 8px 22px var(--bg); }
    .brand-copy { min-width: 0; } h1 { margin: 0; overflow: hidden; font-size: clamp(1rem, 2vw, 1.25rem); line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
    .brand-subtitle { margin-top: 4px; color: var(--muted); font-size: .78rem; }
    #account { display: flex; align-items: center; justify-content: flex-end; gap: 9px; flex-wrap: wrap; }
    #state { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: .84rem; white-space: nowrap; }
    #state::before { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); content: ""; }
    #state.ok::before { background: var(--success); } #state.bad::before { background: var(--danger); }
    .header-actions { display: flex; gap: 8px; } .header-actions button { margin: 0; padding: 8px 10px; font-size: .85rem; }
    main { width: min(1700px, 100%); margin: 0 auto; padding: clamp(18px, 3vw, 34px) clamp(16px, 4vw, 44px) 44px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .toolbar h2 { margin: 0; font-size: clamp(1.2rem, 2.5vw, 1.6rem); } .toolbar p { margin: 5px 0 0; color: var(--muted); font-size: .88rem; }
    .toolbar-actions { display: flex; gap: 8px; } .toolbar-actions button { margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 350px), 1fr)); gap: 20px; align-items: start; }
    .card { position: relative; overflow: visible; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
    .card.movement-open { z-index: 20; }
    .card:focus-within { border-color: var(--accent); }
    .preview { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 17px 17px 0 0; background: var(--bg); color: var(--muted); text-align: center; cursor: zoom-in; }
    .preview img { width: 100%; height: 100%; display: block; object-fit: contain; } .preview::after { position: absolute; inset: 0; pointer-events: none; border: 1px solid var(--border); content: ""; }
    .preview-status { position: absolute; inset: auto 12px 12px 12px; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: .84rem; }
    .preview-status.loading::before { width: 13px; height: 13px; border: 2px solid var(--muted); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; content: ""; }
    .preview-status.error { color: var(--text); } .preview-status.error::before { content: "!"; width: 18px; height: 18px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--surface-2); color: var(--text); font-weight: 800; }
    .privacy-overlay { display: grid; gap: 6px; place-items: center; padding: 20px; color: var(--warning); } .privacy-overlay strong { color: var(--text); }
    .badge-row { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 3; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); color: var(--text); font-size: .73rem; font-weight: 700; }
    .badge::before { width: 7px; height: 7px; border-radius: 50%; background: var(--warning); content: ""; } .badge.privacy::before { background: var(--warning); }
    .card-body { padding: 16px 17px 18px; border-radius: 0 0 17px 17px; } .card-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .name { margin: 0; font-size: 1.06rem; font-weight: 750; } .meta { margin-top: 5px; color: var(--muted); font-size: .82rem; line-height: 1.4; }
    .result { min-height: 1.2em; } .ok { color: var(--success); } .bad { color: var(--text); } .privacy-on { color: var(--warning); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--border); } .actions > button { margin: 0; flex: 1 1 auto; min-width: 125px; padding: 9px 10px; font-size: .84rem; }
    .movement-control { position: relative; flex: 0 0 auto; }
    .movement-toggle { width: auto; min-width: 125px !important; padding: 9px 10px !important; font-size: .84rem; font-weight: inherit; white-space: nowrap; }
    .movement-unavailable { flex: 1 1 100%; }
    .movement-panel { position: absolute; top: calc(100% + 10px); right: 0; z-index: 10; width: min(252px, calc(100vw - 32px)); min-height: 0; margin: 0; padding: 15px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-2); box-shadow: 0 14px 28px var(--bg); }
    .movement-panel.opens-up { top: auto; bottom: calc(100% + 10px); }
    .movement-panel.detached { position: fixed; top: 50%; right: auto; bottom: auto; left: 50%; z-index: 1000; width: min(252px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; transform: translate(-50%, -50%); }
    .ptz-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); } .ptz-toolbar .meta { margin: 0; font-size: .8rem; font-weight: 700; } .step-select { width: 84px; min-width: 84px; padding: 6px 8px; border-radius: 7px; font-size: .8rem; }
    .ptz { display: grid; grid-template-columns: repeat(3, 40px); gap: 5px; margin: 0 auto; justify-content: center; } .ptz button { width: 40px; height: 40px; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-3); font-size: 1rem; }
    .ptz button:hover:not(:disabled) { background: var(--accent); color: var(--text); } .ptz .up { grid-column: 2; grid-row: 1; } .ptz .left { grid-column: 1; grid-row: 2; } .ptz .center { grid-column: 2; grid-row: 2; } .ptz .right { grid-column: 3; grid-row: 2; } .ptz .down { grid-column: 2; grid-row: 3; }
    .ptz .center { background: var(--surface-2); color: var(--muted); cursor: default; } .ptz-result { min-height: 1.2em; margin: 13px 0 0; text-align: center; } .retry-button { margin: 0; padding: 7px 10px; background: var(--surface-2); color: var(--text); font-size: .8rem; }
    .commands-handle { display: none; position: absolute; left: 50%; bottom: 18px; z-index: 7; transform: translateX(-50%); margin: 0; padding: 11px 24px; border: 1px solid var(--accent); border-radius: 999px; background: var(--bg); box-shadow: 0 8px 22px var(--bg); font-weight: 700; }
    .card:fullscreen, .card:-webkit-full-screen, .card.is-fullscreen { width: 100vw; height: 100vh; overflow: hidden; border: 0; border-radius: 0; background: var(--bg); }
    .card:fullscreen .preview, .card:-webkit-full-screen .preview, .card.is-fullscreen .preview { width: 100%; height: 100%; min-height: 0; aspect-ratio: auto; cursor: default; }
    .card:fullscreen .card-body, .card:-webkit-full-screen .card-body, .card.is-fullscreen .card-body { position: absolute; right: 0; bottom: 0; left: 0; z-index: 6; max-height: min(72vh, 650px); overflow-y: auto; padding: 18px clamp(16px, 4vw, 44px) 74px; border-top: 1px solid var(--border); background: var(--surface); box-shadow: 0 -18px 36px var(--bg); transform: translateY(105%); transition: transform .22s ease; }
    .card:fullscreen .movement-control, .card:-webkit-full-screen .movement-control, .card.is-fullscreen .movement-control { flex-basis: 100%; }
    .card:fullscreen .movement-panel, .card:-webkit-full-screen .movement-panel, .card.is-fullscreen .movement-panel { position: static; width: 100%; min-height: 0; margin-top: 10px; box-shadow: none; }
    .card:fullscreen.commands-open .card-body, .card:-webkit-full-screen.commands-open .card-body, .card.is-fullscreen.commands-open .card-body { transform: translateY(0); }
    .card:fullscreen .commands-handle, .card:-webkit-full-screen .commands-handle, .card.is-fullscreen .commands-handle { display: block; }
    .card:fullscreen .badge-row, .card:-webkit-full-screen .badge-row, .card.is-fullscreen .badge-row { top: 18px; left: 20px; right: 20px; }
    .login-wrap { min-height: calc(100vh - 78px); display: grid; place-items: center; padding: 28px 16px; } .login-card { width: min(440px, 100%); padding: clamp(22px, 5vw, 34px); border: 1px solid var(--border); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
    .login-brand { display: block; width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 25px; object-fit: cover; } h2 { margin: 0; font-size: 1.25rem; }
    .login-card p { margin: 8px 0 22px; color: var(--muted); line-height: 1.5; } label { display: block; margin: 15px 0 7px; color: var(--text); font-size: .86rem; font-weight: 650; }
    input, select { width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 11px 12px; background: var(--bg); color: var(--text); } .login-card form button, .login-card > div button { width: 100%; margin-top: 18px; }
    .login-error, .login-info { min-height: 1.35em; margin-top: 13px; font-size: .87rem; } .login-error { color: var(--text); } .login-info { color: var(--success); }
    .empty-state { padding: 40px 20px; border: 1px dashed var(--border); border-radius: 16px; color: var(--muted); text-align: center; } .empty-state strong { display: block; color: var(--text); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 720px) { .app-header { align-items: flex-start; } #account { align-items: flex-end; flex-direction: column; gap: 7px; } .toolbar { align-items: flex-start; flex-direction: column; } .toolbar-actions { width: 100%; } .toolbar-actions button { flex: 1; } }
    @media (max-width: 480px) { .brand-subtitle { display: none; } .brand-icon { width: 40px; height: 40px; border-radius: 12px; } .header-actions button { width: 38px; overflow: hidden; padding: 8px 0; font-size: 0; } .header-actions button::first-letter { font-size: 1rem; } .card-body { padding: 14px; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><img class="brand-icon" src="/assets/topo.png" alt="Topo"><div class="brand-copy"><h1>Topo - desktop app for Tapo camera</h1><div class="brand-subtitle">Cloud control for your cameras</div></div></div>
    <div id="account"><div id="state" aria-live="polite">Login required</div><div class="header-actions"><button id="refreshButton" class="ghost hidden" type="button" title="Refresh cameras" aria-label="Refresh cameras">↻</button><button id="logoutButton" class="danger hidden" type="button">Log out</button></div></div>
  </header>
  <section id="loginView" class="login-wrap"><div class="login-card">
    <img class="login-brand" src="/assets/topo.png" alt="Topo"><div id="credentialsView"><h2>Log in to Tapo</h2><p>Use your Tapo account credentials. Your password is not saved.</p>
      <form id="loginForm"><label for="username">Tapo email/account</label><input id="username" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" type="submit">Log in</button></form><div id="loginError" class="login-error" aria-live="polite"></div>
    </div>
    <div id="mfaView" class="hidden"><h2>MFA verification</h2><p>Complete the verification requested by your Tapo account.</p><label for="mfaType">Verification method</label><select id="mfaType"></select><button id="requestMfaButton" type="button">Send code</button><label for="mfaCode">MFA code</label><input id="mfaCode" inputmode="numeric" autocomplete="one-time-code"><button id="verifyMfaButton" type="button" disabled>Verify code</button><button id="backLoginButton" class="secondary" type="button">Back to login</button><div id="mfaInfo" class="login-info" aria-live="polite"></div><div id="mfaError" class="login-error" aria-live="polite"></div></div>
  </div></section>
  <main id="appView" class="hidden"><div class="toolbar"><div><h2>Your cameras</h2><p id="cameraSummary">Loading cameras…</p></div><div class="toolbar-actions"><button id="refreshMainButton" class="secondary" type="button">↻ Refresh</button></div></div><div id="grid" class="grid" aria-live="polite"></div></main>
  <script>
    const grid = document.querySelector('#grid'), state = document.querySelector('#state'), loginView = document.querySelector('#loginView'), appView = document.querySelector('#appView'), credentialsView = document.querySelector('#credentialsView'), mfaView = document.querySelector('#mfaView'), loginForm = document.querySelector('#loginForm'), loginButton = document.querySelector('#loginButton'), loginError = document.querySelector('#loginError'), mfaType = document.querySelector('#mfaType'), mfaCode = document.querySelector('#mfaCode'), requestMfaButton = document.querySelector('#requestMfaButton'), verifyMfaButton = document.querySelector('#verifyMfaButton'), backLoginButton = document.querySelector('#backLoginButton'), mfaInfo = document.querySelector('#mfaInfo'), mfaError = document.querySelector('#mfaError'), logoutButton = document.querySelector('#logoutButton'), refreshButton = document.querySelector('#refreshButton'), refreshMainButton = document.querySelector('#refreshMainButton'), cameraSummary = document.querySelector('#cameraSummary');
    const STEP_VALUES = {small: 5, medium: 10, large: 20};
    function esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function methodName(value) { return Number(value) === 1 ? 'Tapo app notification' : 'Email'; }
    async function api(path, options = {}) { const response = await fetch(path, options); let data = {}; try { data = await response.json(); } catch (_) {} if (!response.ok) throw new Error(data.error || `HTTP error ${response.status}`); return data; }
    function setState(text, tone = '') { state.textContent = text; state.className = tone; }
    function showLogin() { loginView.classList.remove('hidden'); appView.classList.add('hidden'); logoutButton.classList.add('hidden'); refreshButton.classList.add('hidden'); setState('Login required'); grid.innerHTML = ''; }
    function showCredentials() { credentialsView.classList.remove('hidden'); mfaView.classList.add('hidden'); loginError.textContent = ''; mfaError.textContent = ''; mfaInfo.textContent = ''; }
    function showMfa(types) { const valid = (types || []).map(Number).filter(value => value === 1 || value === 2); mfaType.innerHTML = valid.map(value => `<option value="${value}">${methodName(value)}</option>`).join(''); credentialsView.classList.add('hidden'); mfaView.classList.remove('hidden'); mfaCode.value = ''; verifyMfaButton.disabled = true; mfaInfo.textContent = 'Choose a method and request verification.'; mfaError.textContent = ''; }
    function showApp() { loginView.classList.add('hidden'); appView.classList.remove('hidden'); logoutButton.classList.remove('hidden'); refreshButton.classList.remove('hidden'); }
    function statusBadge(camera) { if (camera.privacy === true) return '<div class="badge-row"><span class="badge privacy">Privacy</span></div>'; return '<div class="badge-row"><span class="badge">Cloud</span></div>'; }
    function previewMarkup(camera) { if (camera.privacy === true) return '<div class="privacy-overlay"><strong>Privacy mode enabled</strong><span>Video and audio are paused</span></div>'; return `<img src="/stream/${encodeURIComponent(camera.id)}.mjpg" alt="Live ${esc(camera.name)}" loading="lazy"><div class="preview-status loading">Connecting to stream…</div><div class="preview-status error hidden">Stream unavailable <button class="retry-button" type="button">Retry</button></div>`; }
    function ptzMarkup(camera) { if (camera.ptz !== true) return `<span class="meta movement-unavailable">${esc(camera.ptz_error || 'Pan & tilt unavailable.')}</span>`; const disabled = camera.privacy === true ? 'disabled' : ''; const panelId = `movement-${esc(camera.id)}`; return `<div class="movement-control"><button class="movement-toggle secondary" type="button" aria-expanded="false" aria-controls="${panelId}">Pan & tilt</button><div id="${panelId}" class="movement-panel hidden"><div class="ptz-toolbar"><span class="meta">Movement step</span><select class="step-select" aria-label="Movement step"><option value="small">5°</option><option value="medium" selected>10°</option><option value="large">20°</option></select></div><div class="ptz" aria-label="Pan and tilt controls"><span></span><button class="ptz-button up" data-x="0" data-y="1" ${disabled} title="Tilt up" aria-label="Tilt up">▲</button><span></span><button class="ptz-button left" data-x="-1" data-y="0" ${disabled} title="Pan left" aria-label="Pan left">◀</button><button class="ptz-button center" data-x="0" data-y="0" disabled title="Current position" aria-label="Current position">•</button><button class="ptz-button right" data-x="1" data-y="0" ${disabled} title="Pan right" aria-label="Pan right">▶</button><span></span><button class="ptz-button down" data-x="0" data-y="-1" ${disabled} title="Tilt down" aria-label="Tilt down">▼</button><span></span></div><div class="meta ptz-result" aria-live="polite">Pan & tilt ready · step 10°</div></div></div>`; }
    function cardMarkup(camera) { const privacyText = camera.privacy === true ? 'Privacy enabled.' : (camera.privacy === false ? 'Privacy disabled.' : (camera.privacy_error || 'Privacy status unavailable.')); const privacyClass = camera.privacy === true ? ' privacy-on' : ''; const privacyDisabled = camera.privacy === null ? 'disabled' : ''; return `<article class="card" data-id="${esc(camera.id)}" data-name="${esc(camera.name)}"><div class="preview" tabindex="0" role="button" aria-label="Open ${esc(camera.name)} fullscreen">${statusBadge(camera)}${previewMarkup(camera)}</div><div class="card-body"><div class="card-heading"><div><h3 class="name">${esc(camera.name)}</h3><div class="meta">${esc(camera.model || 'Camera')} · account ${esc(camera.account_status ?? 'n/a')} · cloud-only</div></div></div><div class="meta result" aria-live="polite">Ready</div><div class="meta privacy-result${privacyClass}" aria-live="polite">${esc(privacyText)}</div><div class="actions"><button class="relay-button" type="button" data-id="${esc(camera.id)}">Check connection</button><button class="secondary privacy-button" type="button" data-id="${esc(camera.id)}" data-enabled="${camera.privacy !== true}" ${privacyDisabled}>${camera.privacy === true ? 'Disable privacy' : 'Enable privacy'}</button><button class="secondary fullscreen-button" type="button">Fullscreen</button>${ptzMarkup(camera)}</div></div><button class="commands-handle" type="button" aria-expanded="false">Controls</button></article>`; }
    function bindStream(card) { const preview = card.querySelector('.preview'), image = preview.querySelector('img'); if (!image) return; const loading = preview.querySelector('.preview-status.loading'), error = preview.querySelector('.preview-status.error'); const setStreamState = failed => { loading?.classList.toggle('hidden', failed || image.complete); error?.classList.toggle('hidden', !failed); }; image.addEventListener('load', () => setStreamState(false)); image.addEventListener('error', () => setStreamState(true)); if (image.complete) setStreamState(image.naturalWidth === 0); preview.querySelector('.retry-button')?.addEventListener('click', event => { event.stopPropagation(); image.src = `/stream/${encodeURIComponent(card.dataset.id)}.mjpg?retry=${Date.now()}`; setStreamState(false); }); }
    async function load() { grid.innerHTML = '<div class="empty-state">Loading cameras…</div>'; cameraSummary.textContent = 'Connecting to Tapo cloud…'; setState('Refreshing…'); try { const data = await api('/api/cameras'); if (!data.cameras?.length) { grid.innerHTML = '<div class="empty-state">No cameras available.</div>'; cameraSummary.textContent = 'No cameras found'; setState('No cameras', 'bad'); return; } grid.innerHTML = data.cameras.map(cardMarkup).join(''); grid.querySelectorAll('.card').forEach(bindStream); grid.querySelectorAll('.relay-button').forEach(button => button.addEventListener('click', () => checkRelay(button.dataset.id, button, button.closest('.card').querySelector('.result')))); grid.querySelectorAll('.privacy-button').forEach(button => button.addEventListener('click', () => setPrivacy(button.dataset.id, button, button.closest('.card')))); grid.querySelectorAll('.fullscreen-button').forEach(button => button.addEventListener('click', () => toggleFullscreen(button.closest('.card')))); grid.querySelectorAll('.preview').forEach(preview => { preview.addEventListener('dblclick', () => toggleFullscreen(preview.closest('.card'))); preview.addEventListener('click', event => { const card = preview.closest('.card'); if (fullscreenElement() === card && card.classList.contains('commands-open') && !event.target.closest('button')) toggleCommands(card, card.querySelector('.commands-handle'), false); }); preview.addEventListener('keydown', event => { if ((event.key === 'Enter' || event.key === ' ') && !event.target.closest('button')) { event.preventDefault(); toggleFullscreen(preview.closest('.card')); } }); }); grid.querySelectorAll('.commands-handle').forEach(button => button.addEventListener('click', () => toggleCommands(button.closest('.card'), button))); grid.querySelectorAll('.movement-toggle').forEach(button => button.addEventListener('click', () => toggleMovement(button, button.closest('.card')))); grid.querySelectorAll('.ptz-button').forEach(button => button.addEventListener('click', () => moveCamera(button, button.closest('.card')))); grid.querySelectorAll('.step-select').forEach(select => select.addEventListener('change', () => { const result = select.closest('.card').querySelector('.ptz-result'); result.textContent = `Pan & tilt ready · step ${STEP_VALUES[select.value]}`; })); cameraSummary.textContent = `${data.cameras.length} ${data.cameras.length === 1 ? 'camera available' : 'cameras available'}`; setState(`${data.cameras.length} cameras from cloud`, 'ok'); } catch (error) { grid.innerHTML = `<div class="empty-state"><strong>Unable to load cameras</strong><div class="meta">${esc(error.message)}</div><button id="loadRetryButton" type="button">Retry</button></div>`; grid.querySelector('#loadRetryButton')?.addEventListener('click', load); cameraSummary.textContent = 'Connection error'; setState(error.message === 'login required' ? 'Login required' : 'Cloud unavailable', 'bad'); if (error.message === 'login required') showLogin(); } }
    function fullscreenElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
    function updateFullscreenButtons() { const active = fullscreenElement(); document.querySelectorAll('.card').forEach(card => { const activeCard = card === active; card.classList.toggle('is-fullscreen', activeCard); if (!activeCard) { card.classList.remove('commands-open'); const handle = card.querySelector('.commands-handle'); if (handle) { handle.setAttribute('aria-expanded', 'false'); handle.textContent = 'Controls'; } } if (card.classList.contains('movement-open')) positionMovementPanel(card); }); document.querySelectorAll('.fullscreen-button').forEach(button => { button.textContent = button.closest('.card') === active ? 'Exit fullscreen' : 'Fullscreen'; }); }
    function positionMovementPanel(card) { const panel = card.querySelector('.movement-panel'), control = card.querySelector('.movement-control'); if (!panel || !control) return; panel.classList.remove('opens-up', 'detached'); if (panel.classList.contains('hidden') || fullscreenElement() === card || card.classList.contains('is-fullscreen')) return; const controlRect = control.getBoundingClientRect(), panelRect = panel.getBoundingClientRect(), padding = 16, gap = 10; const fitsBelow = panelRect.height <= window.innerHeight - controlRect.bottom - gap - padding; const fitsAbove = panelRect.height <= controlRect.top - gap - padding; if (!fitsBelow && fitsAbove) panel.classList.add('opens-up'); else if (!fitsBelow) panel.classList.add('detached'); }
    function repositionOpenMovementPanels() { document.querySelectorAll('.card.movement-open').forEach(positionMovementPanel); }
    function toggleMovement(button, card, force) { const panel = card.querySelector('.movement-panel'); if (!panel) return; const open = force ?? panel.classList.contains('hidden'); panel.classList.toggle('hidden', !open); card.classList.toggle('movement-open', open); button.setAttribute('aria-expanded', String(open)); positionMovementPanel(card); }
    function toggleCommands(card, button, force) { const open = force ?? !card.classList.contains('commands-open'); card.classList.toggle('commands-open', open); button.setAttribute('aria-expanded', String(open)); button.textContent = open ? 'Close controls' : 'Controls'; }
    async function toggleFullscreen(card) { try { if (fullscreenElement() === card || card.classList.contains('is-fullscreen')) { card.classList.remove('is-fullscreen'); if (document.exitFullscreen) await document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } else { if (fullscreenElement()) { if (document.exitFullscreen) await document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } card.classList.add('is-fullscreen'); const request = card.requestFullscreen || card.webkitRequestFullscreen; if (!request) throw new Error('Fullscreen is not supported by this version'); await request.call(card); } } catch (error) { card.classList.remove('is-fullscreen'); const result = card.querySelector('.result'); result.textContent = error.message; result.className = 'meta bad result'; } finally { updateFullscreenButtons(); } }
    document.addEventListener('fullscreenchange', updateFullscreenButtons); document.addEventListener('webkitfullscreenchange', updateFullscreenButtons);
    window.addEventListener('resize', repositionOpenMovementPanels); window.addEventListener('scroll', repositionOpenMovementPanels, true);
    async function checkRelay(id, button, result) { button.disabled = true; result.textContent = 'Checking cloud relay…'; result.className = 'meta'; try { const data = await api(`/api/cameras/${encodeURIComponent(id)}/relay-check`); result.textContent = data.ok ? 'Cloud relay available.' : (data.error || 'Relay unavailable'); result.className = `meta ${data.ok ? 'ok' : 'bad'}`; } catch (error) { result.textContent = error.message; result.className = 'meta bad'; } finally { button.disabled = false; } }
    async function setPrivacy(id, button, card) { const enabled = button.dataset.enabled === 'true', result = card.querySelector('.privacy-result'); button.disabled = true; result.textContent = enabled ? 'Enabling privacy…' : 'Disabling privacy…'; result.className = 'meta'; try { const data = await api(`/api/cameras/${encodeURIComponent(id)}/privacy`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({enabled})}); const isOn = data.privacy === true; card.querySelector('.preview').innerHTML = `${statusBadge({privacy: isOn})}${previewMarkup({id, name: card.dataset.name, privacy: isOn})}`; bindStream(card); card.querySelectorAll('.ptz-button').forEach(control => { if (control.dataset.x !== '0' || control.dataset.y !== '0') control.disabled = isOn; }); button.dataset.enabled = String(!isOn); button.textContent = isOn ? 'Disable privacy' : 'Enable privacy'; result.textContent = isOn ? 'Privacy enabled: video and audio paused.' : 'Privacy disabled.'; result.className = `meta ${isOn ? 'privacy-on' : 'ok'}`; } catch (error) { result.textContent = error.message; result.className = 'meta bad'; } finally { button.disabled = false; } }
    async function moveCamera(button, card) { const step = STEP_VALUES[card.querySelector('.step-select')?.value || 'medium'], x = Number(button.dataset.x) * step, y = Number(button.dataset.y) * step, result = card.querySelector('.ptz-result'), controls = [...card.querySelectorAll('.ptz-button')]; controls.forEach(control => { if (!control.disabled || control === button) control.disabled = true; }); result.textContent = 'Moving…'; result.className = 'meta ptz-result'; try { await api(`/api/cameras/${encodeURIComponent(card.dataset.id)}/move`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({x, y})}); result.textContent = `Move sent · step ${step}°.`; result.className = 'meta ptz-result ok'; } catch (error) { result.textContent = error.message; result.className = 'meta ptz-result bad'; } finally { const privacyOn = card.querySelector('.privacy-button')?.dataset.enabled === 'false'; controls.forEach(control => { if (control.dataset.x !== '0' || control.dataset.y !== '0') control.disabled = privacyOn; }); } }
    loginForm.addEventListener('submit', async event => { event.preventDefault(); loginButton.disabled = true; loginError.textContent = 'Logging in…'; try { const data = await api('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: document.querySelector('#username').value, password: document.querySelector('#password').value})}); if (data.mfa_required) showMfa(data.mfa_types); else { showApp(); await load(); } } catch (error) { loginError.textContent = error.message; } finally { loginButton.disabled = false; } });
    requestMfaButton.addEventListener('click', async () => { requestMfaButton.disabled = true; mfaError.textContent = ''; mfaInfo.textContent = 'Requesting verification…'; try { const data = await api('/api/mfa/request', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({mfa_type: Number(mfaType.value)})}); mfaInfo.textContent = data.mfa_type === 1 ? 'Check the notification in the Tapo app.' : 'Check the code sent by email.'; verifyMfaButton.disabled = false; mfaCode.focus(); } catch (error) { mfaError.textContent = error.message; } finally { requestMfaButton.disabled = false; } });
    verifyMfaButton.addEventListener('click', async () => { verifyMfaButton.disabled = true; mfaError.textContent = ''; mfaInfo.textContent = 'Verifying…'; try { await api('/api/mfa/verify', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({code: mfaCode.value})}); showApp(); await load(); } catch (error) { mfaError.textContent = error.message; verifyMfaButton.disabled = false; } });
    backLoginButton.addEventListener('click', () => { showCredentials(); document.querySelector('#password').value = ''; });
    async function logout() { logoutButton.disabled = true; try { await api('/api/logout', {method: 'POST'}); showCredentials(); showLogin(); } catch (error) { setState(error.message, 'bad'); } finally { logoutButton.disabled = false; } }
    logoutButton.addEventListener('click', logout); refreshButton.addEventListener('click', load); refreshMainButton.addEventListener('click', load);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { const active = fullscreenElement(); if (active?.classList.contains('commands-open')) toggleCommands(active, active.querySelector('.commands-handle'), false); } });
    (async function init() { try { const data = await api('/api/session'); if (data.authenticated) { showApp(); await load(); } else if (data.mfa_pending) showMfa(data.mfa_types); else showLogin(); } catch (_) { showLogin(); } })();
  </script>
