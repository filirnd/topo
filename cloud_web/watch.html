<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topo alert</title>
  <style>
    :root {
      --bg: #141210;
      --text: #f4eee7;
      --muted: #b7aaa0;
      --accent: #d97757;
      --border: rgba(255, 255, 255, .12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 600 13px/1.35 "Segoe UI", sans-serif;
    }
    .shell {
      display: grid;
      grid-template-rows: auto 1fr;
      width: 100%;
      height: 100%;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: rgba(20, 18, 16, .92);
    }
    .meta { color: var(--muted); font-weight: 500; }
    button {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #2a2420;
      color: var(--text);
      padding: 5px 10px;
      cursor: pointer;
    }
    button:hover { background: var(--accent); color: #1b1410; }
    .preview {
      position: relative;
      min-height: 0;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    .status {
      position: absolute;
      left: 10px;
      bottom: 10px;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(0, 0, 0, .55);
      color: var(--muted);
      font-size: 12px;
    }
    .status.error { color: #ffb4a2; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <div id="title">Topo alert</div>
        <div id="subtitle" class="meta">Connecting…</div>
      </div>
      <button id="closeButton" type="button">Close</button>
    </header>
    <div class="preview">
      <video id="video" autoplay muted playsinline preload="auto"></video>
      <div id="status" class="status">Starting preview…</div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const cameraId = params.get('camera') || '0';
    const label = params.get('label') || 'Activity';
    const name = params.get('name') || 'Camera';
    const model = params.get('model') || '';
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const status = document.getElementById('status');
    const video = document.getElementById('video');
    title.textContent = `${name} · ${label}`;
    subtitle.textContent = model ? `${model} · live preview` : 'Live preview';
    document.getElementById('closeButton').addEventListener('click', () => {
      location.href = 'topo://close';
    });
    function setStatus(text, isError) {
      status.textContent = text;
      status.classList.toggle('error', Boolean(isError));
    }
    video.src = `/stream/${encodeURIComponent(cameraId)}.mp4?watch=${Date.now()}`;
    video.addEventListener('playing', () => setStatus('Live'));
    video.addEventListener('error', () => setStatus('Stream unavailable', true));
    const play = video.play();
    if (play) play.catch(() => setStatus('Waiting for stream…'));
  </script>
</body>
</html>
